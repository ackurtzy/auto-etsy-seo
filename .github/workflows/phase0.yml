name: Rebuild safety gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install pinned Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r validation/requirements.txt
      - name: Generate Cloudflare binding types
        run: npm run cf:types
      - name: Type-check and test Phase 2
        run: npm run typecheck:phase2 && npm run test:phase2
      - name: Type-check and test Phase 3
        run: npm run typecheck:phase3 && npm run test:phase3
      - name: Type-check and test Phase 4
        run: npm run typecheck:phase4 && npm run test:phase4
      - name: Build the Phase 4 gate workspace
        run: npx tsc -p apps/web/tsconfig.json --noEmit && npm run build:web
      - name: Apply all migrations to local D1
        run: npm run db:migrate:local
      - name: Bundle the Worker without deploying
        run: npm run cf:dry-run
      - name: Run credential-free unit and fault tests
        run: python3 -m unittest discover -s validation -p 'test_*.py' -v
      - name: Validate Phase 0 boundary
        run: python3 validation/phase0/validate_phase0.py
      - name: Validate Phase 1 tracked evidence
        run: python3 validation/phase1/validate_phase1.py
      - name: Validate Phase 2 contracts and statistical evidence
        run: python3 validation/phase2/validate_phase2.py
      - name: Validate Phase 3 foundation and evidence
        run: python3 validation/phase3/validate_phase3.py
      - name: Validate Phase 4 gate workspace
        run: python3 validation/phase4/validate_phase4.py
